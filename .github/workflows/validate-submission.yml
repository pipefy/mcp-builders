name: Validate submissions

# No paths filter on pull_request on purpose. This check is a required status
# check on main, and a required check that never runs leaves the pull request
# waiting forever. With no filter it always runs, and it exits clean when a
# pull request touches no submission.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "submissions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate
        run: python3 scripts/validate_submission.py
