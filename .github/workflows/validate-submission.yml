name: Validate submissions

on:
  pull_request:
    paths:
      - "submissions/**"
      - "scripts/validate_submission.py"
      - ".github/workflows/validate-submission.yml"
  push:
    branches: [main]
    paths:
      - "submissions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate
        run: python3 scripts/validate_submission.py
